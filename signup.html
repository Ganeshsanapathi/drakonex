<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAKONEX Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050b12;
    color:white;
}

.signup-container{
    width:420px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(0,198,255,0.3);
    box-shadow:0 0 25px rgba(0,198,255,0.2);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#00c6ff;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#d0d0d0;
}

input,select{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
}

select option{
    color:black;
}

.signup-btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.signup-btn:hover{
    transform:scale(1.02);
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#00c6ff;
    text-decoration:none;
    font-weight:bold;
}

.secure{
    text-align:center;
    margin-top:15px;
    color:#cccccc;
}
small{
    display:block;
    margin-top:-5px;
    margin-bottom:10px;
    font-size:12px;
    color:#00c6ff;
}
.terms{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-size:16px;
    margin:15px 0;
}

.terms input{
    width:18px;
    height:18px;
    accent-color:#00c6ff;
}
</style>
</head>

<body>

<div class="signup-container">

    <div class="logo">DRAKONEX</div>
    

    <div class="subtitle">
        Create Your Account
    </div>

    <form id="signupForm">

        <input type="text" id="fullname"placeholder="Full Name"required>

        <input type="email" id="email" placeholder="Email Address" required>
        <small style="color:#00c6ff;">
📧 Verification email will be sent
</small>

        <input type="tel"id="mobile" placeholder="Mobile Number" required>
        <small style="color:#00c6ff;">
📱 OTP verification required
</small>

        <input type="text"id="college" placeholder="College Name" required>

        <select id="course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>MCA</option>
            <option>M.Sc</option>
            <option>Other</option>
        </select>

        <input type="password" id="password"placeholder="Password" required>
        <p id="strength" style="color:#00c6ff;font-size:13px;">
Password Strength
</p>
        <label class="terms">
    <input type="checkbox" required>
    I agree to Terms & Conditions
</label>
         <button class="signup-btn">
            Create DRAKONEX Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="secure">
        🔒 Secure Registration
    </div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_jrxeAbxNpxx8W2j9Jv1WBdm5PZenabY",
  authDomain: "drakonex-85bfb.firebaseapp.com",
  projectId: "drakonex-85bfb",
  storageBucket: "drakonex-85bfb.firebasestorage.app",
  messagingSenderId: "741530513003",
  appId: "1:741530513003:web:912806f58475a24d448b2e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("signupForm").addEventListener("submit", (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {

        alert("Account Created Successfully!");

        window.location.href = "login.html";

    })
    .catch((error) => {

        alert(error.message);

    });

});

</script>
</body>
</html>
